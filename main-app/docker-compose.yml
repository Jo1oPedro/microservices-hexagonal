services:
  app:
    container_name: hyperf-skeleton
    image: hyperf-skeleton
    build:
      dockerfile: dev.Dockerfile
      args:
        UID: 1000
        GID: 1000
    command: ["php", "bin/hyperf.php", "server:watch"]
    volumes:
      - ./:/opt/www
    ports:
      - 9501:9501
    environment:
      APP_ENV: ${APP_ENV:-dev}
      SCAN_CACHEABLE: "false"
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-hyperf_url_shortner}
      DB_USERNAME: ${DB_USERNAME:-hyperf}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      ZIPKIN_ENDPOINT_URL: http://jaeger:9411/api/v2/spans
    networks:
      - hyperf-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: hyperf-mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-hyperf}
      MYSQL_USER: ${DB_USERNAME:-hyperf}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootsecret" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hyperf-network

  redis:
    image: redis:7-alpine
    container_name: hyperf-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hyperf-network

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${AMQP_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${AMQP_PASSWORD:-guest}
    networks:
      - hyperf-network

  jaeger:
    image: jaegertracing/all-in-one:1.55
    ports:
      - "16686:16686"
      - "9411:9411"
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    networks:
      - hyperf-network

volumes:
  mysql-data:
  redis-data:

networks:
  hyperf-network:
    name: hyperf-network
