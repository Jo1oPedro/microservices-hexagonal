services:
  mysql:
    image: mysql:8.0
    container_name: hyperf-mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-hyperf_test}
      MYSQL_USER: ${DB_USERNAME:-hyperf}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql  # ← isso aqui
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootsecret" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hyperf-network