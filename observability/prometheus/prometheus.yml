global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # métricas internas do Collector (CPU, memória, queue size)
  - job_name: 'otel-collector-internal'
    static_configs:
      - targets: ['otel-collector:8888']

  # spanmetrics + métricas customizadas dos apps
  - job_name: 'otel-collector-app-metrics'
    static_configs:
      - targets: ['otel-collector:8889']

  # próprio prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']